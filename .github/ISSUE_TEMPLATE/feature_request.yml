name: Feature request
description: Suggest an idea for md3
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task or comparison you're trying to make, in your own words.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: md3 only ships a feature with a clear edge over the free tools. Which tool do you use now, and what's missing?
  - type: textarea
    id: idea
    attributes:
      label: Your idea
